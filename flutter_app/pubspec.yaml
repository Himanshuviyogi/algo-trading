name: algo_trading
description: Algo Trading App — built on Stockara infrastructure
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.6
  firebase_messaging: ^15.2.5
  cloud_functions: ^5.1.3

  # State management & navigation
  flutter_bloc: ^9.1.1
  go_router: ^14.8.1
  equatable: ^2.0.7

  # Storage & networking
  shared_preferences: ^2.3.0
  http: ^1.2.2

  # UI
  webview_flutter: ^4.10.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0

  # Notifications & audio
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0

  # Real-time prices
  socket_io_client: ^2.0.3+1

  # Payments
  razorpay_flutter: ^1.3.6

  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^6.1.4
  lottie: ^3.1.3
  flutter_markdown: ^0.7.6
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/lottie/
